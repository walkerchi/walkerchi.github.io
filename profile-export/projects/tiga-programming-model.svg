<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
  <title id="title">Graph × MessagePassing → compiled kernel</title>
  <desc id="desc">A Graph records who talks to whom. A MessagePassing program says what each edge sends and how messages combine. A call captures a deferred expression. Observation selects execution, with JIT compilation on supported native paths and a compiler-derived VJP.</desc>
  <defs>
    <marker id="pmA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#4f46e5" />
    </marker>
    <marker id="pmB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#64748b" />
    </marker>
    <style>
      text{font-family:Arial,sans-serif}
      .lbl{font-size:16px;font-weight:700;fill:#0f172a}
      .sub{font-size:12px;fill:#64748b}
      .mono{font-family:Consolas,monospace;font-size:12.5px;fill:#312e81}
      .monoW{font-family:Consolas,monospace;font-size:12.5px;font-weight:700;fill:#ffffff}
      .nodeLbl{font-size:13px;font-weight:700;fill:#312e81;text-anchor:middle}
      .op{font-size:26px;font-weight:700;fill:#94a3b8}
    </style>
  </defs>

  <!-- Graph: who talks to whom -->
  <rect x="30" y="70" width="280" height="240" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="lbl" x="56" y="106">Graph</text>
  <text class="sub" x="56" y="128">who talks to whom</text>

  <!-- edges of the 60-second example: 0→0, 2→0, 1→1, 0→2, 1→2 -->
  <path d="M105 199 C 82 168 128 168 105 197" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#pmA)"/>
  <path d="M240 149 C 216 118 264 118 240 147" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#pmA)"/>
  <path d="M226 252 C 190 238 152 228 123 220" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#pmA)"/>
  <path d="M121 232 C 155 244 193 254 224 263" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#pmA)"/>
  <path d="M240 183 L240 247" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#pmA)"/>

  <circle cx="105" cy="215" r="16" fill="#ffffff" stroke="#4f46e5" stroke-width="2.4"/>
  <text class="nodeLbl" x="105" y="220">0</text>
  <circle cx="240" cy="165" r="16" fill="#ffffff" stroke="#4f46e5" stroke-width="2.4"/>
  <text class="nodeLbl" x="240" y="170">1</text>
  <circle cx="240" cy="265" r="16" fill="#ffffff" stroke="#4f46e5" stroke-width="2.4"/>
  <text class="nodeLbl" x="240" y="270">2</text>

  <text class="op" x="322" y="200">×</text>

  <!-- MessagePassing: what is said -->
  <rect x="360" y="70" width="280" height="240" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="lbl" x="386" y="106">MessagePassing</text>
  <text class="sub" x="386" y="128">what each edge says</text>

  <rect x="382" y="150" width="236" height="40" rx="9" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
  <text class="mono" x="396" y="175">edge(src, dst, edge)</text>
  <rect x="382" y="205" width="236" height="40" rx="9" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
  <text class="mono" x="396" y="230">reducer = tg.sum()</text>
  <rect x="382" y="260" width="236" height="40" rx="9" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
  <text class="mono" x="396" y="285">node(dst, aggregate)</text>

  <path d="M652 190 L692 190" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#pmB)"/>

  <!-- capture connects the relation and message program -->
  <rect x="706" y="70" width="264" height="240" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="lbl" x="732" y="106">capture + observe</text>
  <text class="sub" x="732" y="128">native JIT on supported paths</text>

  <text class="mono" x="732" y="186">out = [11.1, 8.2, 17.3]</text>
  <rect x="730" y="212" width="214" height="42" rx="9" fill="#4f46e5"/>
  <text class="monoW" x="745" y="239">+ generated VJP</text>
</svg>
